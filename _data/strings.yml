# Every word and phrase the theme prints by itself.
# Translate or reword anything here and it changes everywhere. Your own content
# (pages, notes, projects, and the settings in _config.yml) is written where it lives, not here.
# Delete a line and the English text built into the theme is used instead.
# Also set `lang:` in _config.yml (for example `lang: fr`) so browsers know the page language.

# Date shown on notes. Uses Ruby's strftime codes: %-d is the day, %b the short month, %Y the year.
# Month names always come out in English, so for another language use a numeric format such as "%d/%m/%Y".
date_format: "%-d %b %Y"

# --- Navigation and header ---------------------------------------------------
skip_link: "Skip to content"      # the link that appears when you press Tab on a page
nav: "Main"                       # screen-reader name of the main menu
menu: "Menu"                      # the phone menu button
dark_mode: "Dark mode"            # the light/dark switch

# --- Footer ------------------------------------------------------------------
footer_nav: "Footer"              # screen-reader name of the footer menu
footer_heading: "Let's make something amazing together."   # used unless izar.footer.heading is set in _config.yml
footer_start_by: "Start by"       # used unless izar.footer.action.before is set
footer_say_hi: "saying hi"        # used unless izar.footer.action.label is set
footer_info: "Information"        # used unless izar.footer.info_label is set
all_rights_reserved: "All rights reserved"   # printed after "© 2026"
made_by_humans: "Proudly built by humans (not AI) using <a href='https://jekyllrb.com/'>open source code</a>"

